name: Publish Music Source
on:
  push:
    branches: [master]
    paths: ['**/*.js']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy JS to docs
        run: |
          mkdir -p docs
          cp *.js docs/
          touch docs/.nojekyll
          touch docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
